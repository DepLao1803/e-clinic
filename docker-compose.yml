# Infra only. api & web run on the host (fast HMR); only stateful services live in Docker.
name: e-clinic
services:
  db:
    image: mysql:8.4
    container_name: eclinic-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-e_clinic_db}
      MYSQL_USER: ${MYSQL_USER:-eclinic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eclinic}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    container_name: eclinic-adminer
    restart: unless-stopped
    depends_on: [db]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

  mailpit:
    image: axllent/mailpit:latest
    container_name: eclinic-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  mysql_data:
